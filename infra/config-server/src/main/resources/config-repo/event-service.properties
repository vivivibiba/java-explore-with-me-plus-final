server.port=0
logging.level.org.zalando.logbook.Logbook=TRACE
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/events
spring.datasource.username=events
spring.datasource.password=events
stats.server.id=stats-server
management.endpoints.web.exposure.include=health,info
