spring.application.name=analyzer-test
eureka.client.enabled=false
spring.cloud.config.enabled=false
grpc.server.port=0
spring.datasource.url=jdbc:h2:mem:analyzer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
analyzer.kafka.bootstrap-servers=localhost:9092
analyzer.kafka.user-actions-topic=stats.user-actions.v1
analyzer.kafka.events-similarity-topic=stats.events-similarity.v1
analyzer.kafka.user-actions-group-id=ewm-analyzer-actions-test
analyzer.kafka.similarity-group-id=ewm-analyzer-similarity-test
analyzer.recommendations.neighbors=10
