services:
  discovery-server:
    build: infra/discovery-server
    image: ewm-discovery-server
    container_name: ewm-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  config-server:
    build: infra/config-server
    image: ewm-config-server
    container_name: ewm-config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Accept: application/json' http://discovery-server:8761/eureka/apps/CONFIG-SERVER | grep -q '\"status\":\"UP\"'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  kafka:
    image: confluentinc/confluent-local:7.4.3
    container_name: ewm-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: ewm-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
      "

  users-db:
    image: postgres:16.1
    container_name: ewm-users-db
    ports: ["6542:5432"]
    environment:
      POSTGRES_PASSWORD: users
      POSTGRES_USER: users
      POSTGRES_DB: users
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  events-db:
    image: postgres:16.1
    container_name: ewm-events-db
    ports: ["6543:5432"]
    environment:
      POSTGRES_PASSWORD: events
      POSTGRES_USER: events
      POSTGRES_DB: events
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  requests-db:
    image: postgres:16.1
    container_name: ewm-requests-db
    ports: ["6544:5432"]
    environment:
      POSTGRES_PASSWORD: requests
      POSTGRES_USER: requests
      POSTGRES_DB: requests
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  comments-db:
    image: postgres:16.1
    container_name: ewm-comments-db
    ports: ["6545:5432"]
    environment:
      POSTGRES_PASSWORD: comments
      POSTGRES_USER: comments
      POSTGRES_DB: comments
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports: ["6541:5432"]
    environment:
      POSTGRES_PASSWORD: stats
      POSTGRES_USER: stats
      POSTGRES_DB: stats
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  analyzer-db:
    image: postgres:16.1
    container_name: ewm-analyzer-db
    ports: ["6546:5432"]
    environment:
      POSTGRES_PASSWORD: analyzer
      POSTGRES_USER: analyzer
      POSTGRES_DB: analyzer
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  collector:
    build: stats-service/collector
    image: ewm-collector
    container_name: ewm-collector
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - COLLECTOR_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  aggregator:
    build: stats-service/aggregator
    image: ewm-aggregator
    container_name: ewm-aggregator
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - AGGREGATOR_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  analyzer:
    build: stats-service/analyzer
    image: ewm-analyzer
    container_name: ewm-analyzer
    depends_on:
      analyzer-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - ANALYZER_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://analyzer-db:5432/analyzer
      - SPRING_DATASOURCE_USERNAME=analyzer
      - SPRING_DATASOURCE_PASSWORD=analyzer

  stats-server:
    build: ./stats-service
    image: ewm-stats-server
    container_name: ewm-stats-server
    depends_on:
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/stats
      - SPRING_DATASOURCE_USERNAME=stats
      - SPRING_DATASOURCE_PASSWORD=stats

  user-service:
    build: core/user-service
    image: ewm-user-service
    container_name: ewm-user-service
    depends_on:
      users-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://users-db:5432/users
      - SPRING_DATASOURCE_USERNAME=users
      - SPRING_DATASOURCE_PASSWORD=users

  event-service:
    build: core/event-service
    image: ewm-event-service
    container_name: ewm-event-service
    depends_on:
      events-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      analyzer:
        condition: service_started
      collector:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://events-db:5432/events
      - SPRING_DATASOURCE_USERNAME=events
      - SPRING_DATASOURCE_PASSWORD=events

  request-service:
    build: core/request-service
    image: ewm-request-service
    container_name: ewm-request-service
    depends_on:
      requests-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      collector:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://requests-db:5432/requests
      - SPRING_DATASOURCE_USERNAME=requests
      - SPRING_DATASOURCE_PASSWORD=requests

  comment-service:
    build: core/comment-service
    image: ewm-comment-service
    container_name: ewm-comment-service
    depends_on:
      comments-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comments-db:5432/comments
      - SPRING_DATASOURCE_USERNAME=comments
      - SPRING_DATASOURCE_PASSWORD=comments

  main-service:
    build: core/main-service
    image: ewm-main-service
    container_name: ewm-main-service
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

  gateway-server:
    build: infra/gateway-server
    image: ewm-gateway-server
    container_name: ewm-gateway-server
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
      event-service:
        condition: service_started
      request-service:
        condition: service_started
      comment-service:
        condition: service_started
      stats-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
